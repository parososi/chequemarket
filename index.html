<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feliz Aniversário Raissa</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-stage="0">
    <canvas id="confetti" aria-hidden="true"></canvas>
    <div id="balloons" aria-hidden="true"></div>

    <main class="page">
      <header class="hero">
        <p class="title">Raissa ❤️</p>
      </header>

      <section class="stage" aria-live="polite">
        <div class="sparkles" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="animals" aria-hidden="true"></div>

        <div class="cake" role="img" aria-label="Bolo de aniversário com velas">
          <div class="plate"></div>
          <div class="cake-base">
            <div class="icing"></div>
            <div class="drip"></div>
            <div class="drip"></div>
            <div class="drip"></div>
          </div>
          <div class="candles" aria-hidden="true">
            <div class="candle lit" data-index="0"><span class="flame"></span></div>
            <div class="candle lit" data-index="1"><span class="flame"></span></div>
            <div class="candle lit" data-index="2"><span class="flame"></span></div>
          </div>
        </div>
      </section>

      <section class="controls">
        <p class="instruction">
          Assopre no microfone para apagar as velas 🎂💨 e toque nos animais para abrir as cartinhas ✉️
        </p>
        <div class="meter" aria-hidden="true">
          <div class="meter-fill" id="meterFill"></div>
        </div>
        <button class="btn" id="micButton">Ativar Microfone</button>
        <button class="btn btn-secondary hidden" id="fallbackButton">
          Toque para apagar
        </button>
      </section>

      <section class="message" id="message" aria-live="polite">
        FELIZ ANIVERSÁRIO MEU AMOR EU TE AMO!
      </section>
    </main>

    <div class="modal hidden" id="letterModal" aria-hidden="true" role="dialog" aria-modal="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-card" role="document">
        <button class="modal-close" type="button" aria-label="Fechar">×</button>
        <p class="modal-sender" id="modalSender"></p>
        <div class="envelope" aria-hidden="true">
          <div class="envelope-flap"></div>
          <div class="envelope-body"></div>
          <div class="letter">
            <p id="modalMessage"></p>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
